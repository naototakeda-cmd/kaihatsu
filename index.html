<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>でんとるん レンタル人事部 | 無料相談</title>
  <meta name="description" content="歯科医院専門のレンタル人事部。採用から定着まで、院長の代わりに人事業務を支援します。">
  <style>
    :root {
      --canvas: 516px;
      --navy: #071f63;
      --gold: #c27c12;
      --line: rgba(194, 124, 18, 0.22);
      --shadow: 0 14px 36px rgba(7, 31, 99, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #f6f2ec;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--navy);
      font-family: "Hiragino Sans", "Yu Gothic", "YuGothic", Meiryo, sans-serif;
      background:
        linear-gradient(90deg, rgba(7, 31, 99, 0.06), transparent 18%, transparent 82%, rgba(7, 31, 99, 0.06)),
        #fbfaf8;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      width: min(100%, var(--canvas));
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 0 46px rgba(20, 27, 43, 0.12);
      overflow: hidden;
      padding-bottom: 82px;
    }

    .slice {
      position: relative;
      margin: 0;
      line-height: 0;
    }

    .slice img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
    }

    .hotspot {
      position: absolute;
      z-index: 5;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.01);
      color: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-tap-highlight-color: rgba(194, 124, 18, 0.2);
    }

    .hotspot:focus-visible {
      outline: 3px solid rgba(12, 143, 239, 0.9);
      outline-offset: 3px;
      background: rgba(255, 255, 255, 0.14);
    }

    .hero-nav-service {
      left: 51.5%;
      top: 3%;
      width: 13.8%;
      height: 5%;
    }

    .hero-nav-faq {
      left: 65.6%;
      top: 3%;
      width: 14.8%;
      height: 5%;
    }

    .hero-nav-cta {
      left: 81.4%;
      top: 2.4%;
      width: 15%;
      height: 5.1%;
    }

    .cta-hero {
      left: 10.5%;
      top: 88.2%;
      width: 78.8%;
      height: 6.4%;
    }

    .cta-problems {
      left: 22.5%;
      top: 91%;
      width: 55.4%;
      height: 5.3%;
    }

    .cta-service {
      left: 7.7%;
      top: 93.5%;
      width: 84.6%;
      height: 6.3%;
    }

    .cta-process {
      left: 14.5%;
      top: 91.9%;
      width: 74.8%;
      height: 5.9%;
    }

    .cta-results {
      left: 11.4%;
      top: 93.5%;
      width: 77.1%;
      height: 5.5%;
    }

    .cta-submit {
      left: 21.5%;
      top: 90.3%;
      width: 56.8%;
      height: 5.4%;
    }

    .footer-policy {
      left: 62%;
      top: 96.2%;
      width: 18.5%;
      height: 2.1%;
      border-radius: 3px;
    }

    .footer-about {
      left: 83%;
      top: 96.2%;
      width: 12.5%;
      height: 2.1%;
      border-radius: 3px;
    }

    .consult-form {
      position: absolute;
      z-index: 4;
      left: 55.1%;
      top: 68.1%;
      width: 37.7%;
      height: 17.8%;
      line-height: normal;
    }

    .field,
    .message {
      position: absolute;
      left: 0;
      width: 100%;
      border: 1px solid rgba(49, 91, 159, 0.18);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.74);
      color: var(--navy);
      outline: none;
      box-shadow: inset 0 1px 2px rgba(7, 31, 99, 0.04);
    }

    .field {
      height: 11.4%;
      padding: 0 9px;
      font-size: clamp(11px, 2.6vw, 14.4px);
    }

    .message {
      top: 60.8%;
      height: 36.6%;
      padding: 8px 9px;
      resize: none;
      font-size: clamp(11px, 2.6vw, 14.4px);
    }

    .field::placeholder,
    .message::placeholder {
      color: rgba(7, 31, 99, 0.34);
    }

    .field:focus,
    .message:focus {
      border-color: #0c8fef;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 0 0 3px rgba(12, 143, 239, 0.18);
    }

    .field:nth-of-type(1) { top: 0; }
    .field:nth-of-type(2) { top: 12.2%; }
    .field:nth-of-type(3) { top: 24.5%; }
    .field:nth-of-type(4) { top: 36.7%; }
    .field:nth-of-type(5) { top: 48.9%; }

    .fixed-cta {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 12px;
      width: min(calc(100% - 28px), 456px);
      min-height: 66px;
      transform: translateX(-50%);
      border: 2px solid rgba(255, 255, 255, 0.78);
      border-radius: 999px;
      background: linear-gradient(180deg, #dfa33e, #a96707);
      color: #fff;
      box-shadow: 0 10px 24px rgba(105, 62, 6, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: clamp(22px, 5.5vw, 26px);
      letter-spacing: 0;
      cursor: pointer;
    }

    .fixed-cta svg {
      flex: 0 0 auto;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(7, 31, 99, 0.45);
    }

    .modal.is-open {
      display: grid;
    }

    .modal-panel {
      width: min(100%, 360px);
      border-radius: 8px;
      background: #fff;
      padding: 26px 22px 22px;
      color: var(--navy);
      box-shadow: var(--shadow);
      line-height: 1.8;
      text-align: left;
    }

    .modal-panel h2 {
      margin: 0 0 10px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .modal-panel p {
      margin: 0 0 18px;
      font-size: 14px;
    }

    .modal-panel button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--navy);
      cursor: pointer;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 360px) {
      .fixed-cta {
        min-height: 54px;
        font-size: 19px;
      }

      .field,
      .message {
        padding-left: 6px;
        padding-right: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="でんとるん レンタル人事部 ランディングページ">
    <section class="slice" id="top" aria-labelledby="hero-heading">
      <img src="assets/01-hero.png" alt="院長は、診療に集中してください。採用・定着の人事業務は、でんとるんのレンタル人事部が回します。">
      <h1 id="hero-heading" class="sr-only">院長は、診療に集中してください。</h1>
      <button class="hotspot hero-nav-service" type="button" data-scroll="#service">サービス内容</button>
      <button class="hotspot hero-nav-faq" type="button" data-scroll="#faq">よくあるご質問</button>
      <button class="hotspot hero-nav-cta" type="button" data-scroll="#consult">無料相談する</button>
      <button class="hotspot cta-hero" type="button" data-scroll="#consult">今すぐ無料相談する</button>
    </section>

    <section class="slice" id="problems">
      <img src="assets/02-problems.png" alt="こんなお悩みありませんか。応募が来ない、退職の予兆が掴めない、PDCAが回らない。">
      <p class="sr-only">採用だけではなく、定着まで見据えた人事の仕組みが必要です。</p>
      <button class="hotspot cta-problems" type="button" data-scroll="#consult">今すぐ無料相談する</button>
    </section>

    <section class="slice" id="results">
      <img src="assets/03-results.png" alt="成果事例。人事担当を雇う前に月15万円のレンタル人事部を。対応職種は歯科医師、歯科衛生士、歯科助手、歯科技工士。">
      <button class="hotspot cta-results" type="button" data-scroll="#consult">今すぐ無料相談する</button>
    </section>

    <section class="slice" id="service" aria-labelledby="service-heading">
      <img src="assets/04-service.png" alt="人事担当を雇う前に、歯科医院専門のレンタル人事部を。選ばれる3つの理由とサービス内容。">
      <h2 id="service-heading" class="sr-only">でんとるんのサービス内容</h2>
      <button class="hotspot cta-service" type="button" data-scroll="#consult">今すぐ無料相談する</button>
    </section>

    <section class="slice" id="process">
      <img src="assets/05-process.png" alt="求人を出すだけでは採用も定着も変わりません。求人設計、媒体運用、応募者対応、面接前ヒアリング、入職後1on1、改善PDCAまで回します。">
      <button class="hotspot cta-process" type="button" data-scroll="#consult">今すぐ無料相談する</button>
    </section>

    <section class="slice" id="faq" aria-labelledby="faq-heading">
      <img src="assets/06-form.png" alt="代表からのメッセージ、よくある質問、無料相談フォーム。">
      <h2 id="faq-heading" class="sr-only">よくある質問と無料相談フォーム</h2>
      <form class="consult-form" id="consult" aria-label="無料相談フォーム">
        <label class="sr-only" for="clinic">医院名</label>
        <input class="field" id="clinic" name="clinic" autocomplete="organization" placeholder="例）でんとるん歯科クリニック" required>

        <label class="sr-only" for="name">お名前</label>
        <input class="field" id="name" name="name" autocomplete="name" placeholder="例）山田 太郎" required>

        <label class="sr-only" for="role">役職</label>
        <input class="field" id="role" name="role" autocomplete="organization-title" placeholder="例）院長" required>

        <label class="sr-only" for="tel">電話番号</label>
        <input class="field" id="tel" name="tel" inputmode="tel" autocomplete="tel" placeholder="例）090-1234-5678" required>

        <label class="sr-only" for="email">メールアドレス</label>
        <input class="field" id="email" name="email" type="email" autocomplete="email" placeholder="例）sample@dental-clinic.jp" required>

        <label class="sr-only" for="message">ご相談内容</label>
        <textarea class="message" id="message" name="message" placeholder="例）採用がうまくいかないので相談したいです" required></textarea>
      </form>
      <button class="hotspot cta-submit" type="button" data-submit>今すぐ無料相談する</button>
      <a class="hotspot footer-policy" href="https://pitatto-saiyo.com/privacy-policy" target="_blank" rel="noopener noreferrer" aria-label="プライバシーポリシーを開く">プライバシーポリシー</a>
      <a class="hotspot footer-about" href="https://pitatto-saiyo.com/about" target="_blank" rel="noopener noreferrer" aria-label="会社概要を開く">会社概要</a>
    </section>
  </main>

  <button class="fixed-cta" type="button" data-scroll="#consult" aria-label="無料相談フォームへ移動">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3H13a8.48 8.48 0 0 1 8 8v.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 12h.01M12 12h.01M16 12h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    今すぐ無料相談する
  </button>

  <div class="modal" id="thanks" role="dialog" aria-modal="true" aria-labelledby="thanks-title">
    <div class="modal-panel">
      <h2 id="thanks-title">送信内容を受け付けました</h2>
      <p>Typeformや外部フォームURLを設定すると、このボタンから実際の送信先へ連携できます。現状はローカル確認用の完了表示です。</p>
      <button type="button" data-close-modal>閉じる</button>
    </div>
  </div>

  <script>
    const TYPEFORM_URL = "";
    const form = document.querySelector("#consult");
    const modal = document.querySelector("#thanks");

    if (location.protocol !== "file:" && location.pathname === "/lp2") {
      document.querySelectorAll('img[src^="assets/"]').forEach((image) => {
        image.src = `/lp2/${image.getAttribute("src")}`;
      });
    }

    function scrollToTarget(selector) {
      const target = document.querySelector(selector);
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      if (selector === "#consult") {
        window.setTimeout(() => {
          const first = form.querySelector("input, textarea");
          first && first.focus({ preventScroll: true });
        }, 500);
      }
    }

    function buildTypeformUrl() {
      const data = new FormData(form);
      const url = new URL(TYPEFORM_URL);
      for (const [key, value] of data.entries()) {
        url.searchParams.set(key, value);
      }
      return url.toString();
    }

    document.querySelectorAll("[data-scroll]").forEach((button) => {
      button.addEventListener("click", () => scrollToTarget(button.dataset.scroll));
    });

    document.querySelector("[data-submit]").addEventListener("click", () => {
      if (!form.reportValidity()) return;
      if (TYPEFORM_URL) {
        window.open(buildTypeformUrl(), "_blank", "noopener,noreferrer");
        return;
      }
      modal.classList.add("is-open");
    });

    document.querySelector("[data-close-modal]").addEventListener("click", () => {
      modal.classList.remove("is-open");
    });

    modal.addEventListener("click", (event) => {
      if (event.target === modal) modal.classList.remove("is-open");
    });
  </script>
</body>
</html>
